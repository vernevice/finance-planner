      # Thresholds are the upper bound of each bracket; rate applies to the
      # portion of taxable income within it. Excludes Medicare levy.
      - { up_to: 18200, rate: 0.00 }
      - { up_to: 45000, rate: 0.15 }
      - { up_to: 135000, rate: 0.30 }
      - { up_to: 190000, rate: 0.37 }
      - { up_to: null, rate: 0.45 }
    candidate_source: search summary of ATO "Tax rates – Australian resident"
    source_url: https://www.ato.gov.au/tax-rates-and-codes/tax-rates-australian-residents
    verified_on: null
    verified_by: null
    notes: >-
      The 15% figure reportedly reflects the lowest marginal rate falling from
      16% to 15% on 1 July 2026. The $18,200 tax-free threshold was NOT
      confirmed for 2026–27 by the search result and is carried from model
      memory — treat it as the least trustworthy line here. A further cut to
      14% is understood to be legislated for 1 July 2027; that belongs in
      FY2028.yaml, not this file.

  medicare_levy:
    value: null
    status: UNVERIFIED
    candidate: 0.02
    candidate_source: MODEL_MEMORY — search did not return a rate for 2026–27
    source_url: https://www.ato.gov.au/individuals-and-families/medicare-and-private-health-insurance/medicare-levy
    verified_on: null
    verified_by: null
    notes: >-
      Low-income reductions and the Medicare levy surcharge are separate
      mechanisms and are not modelled here. If either household member's
      marginal calculation is near a surcharge threshold, that needs its own
      entry before the super hurdle in §5.2 can be trusted.


# tax/FY2027.yaml — Australian tax parameters for the 2026–27 income year
# (1 July 2026 – 30 June 2027).
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠  EVERY VALUE IN THIS FILE IS `UNVERIFIED`. NOTHING HERE MAY BE USED.
#
# Invariant §2.4: tax and threshold values are stamped with the source and the
# date they were verified, and are never asserted from model memory. On
# 2026-08-04 an attempt was made to verify these against ato.gov.au directly.
# It failed: `www.ato.gov.au:443` is blocked by this session's network egress
# policy (gateway answered 403 to CONNECT). The ATO pages could not be read.
#
# The `candidate` fields below are LEADS FOR A HUMAN VERIFIER, not values.
# They come from search-engine summaries of ATO pages — second-hand, possibly
# stale, possibly conflating income years — or, where marked, from model
# memory, which §2.4 forbids relying on outright. `value:` is null everywhere,
# and `policy.reporting.block_on_unverified_tax_values` is true, so the engine
# must refuse to produce a recommendation rather than quietly using a guess.
#
# TO VERIFY: open each source_url, confirm the figure applies to 2026–27, copy
# it into `value:`, set `status: VERIFIED`, and fill `verified_on` /
# `verified_by`. See docs/decisions/0002-tax-values-unverified.md.
# ─────────────────────────────────────────────────────────────────────────────

